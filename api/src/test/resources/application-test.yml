spring:
  datasource:
    url: ${testcontainers.mysql.url}
    username: ${testcontainers.mysql.username}
    password: ${testcontainers.mysql.password}
  data:
    redis:
      host: ${testcontainers.redis.host}
      port: ${testcontainers.redis.port}
  flyway:
    locations: classpath:db/migration,classpath:db/seed/common,classpath:db/seed/nonprod

merchant:
  scheduling:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: 127.0.0.1
    port: 1
    database: container_required
    username: test
    password: test
  redis:
    host: 127.0.0.1
    port: 1
    database: 0
  websocket:
    enabled: false
  alioss:
    endpoint: https://oss-cn-shenzhen.aliyuncs.com
    access-key-id: test-only
    access-key-secret: test-only
    bucket-name: test-only
  wechat:
    appid: test-only
    secret: test-only
  shop:
    address: test-only
  baidu:
    ak: test-only
  openapi:
    enabled: true
