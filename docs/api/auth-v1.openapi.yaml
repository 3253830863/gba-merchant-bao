components:
  schemas:
    Sms:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
      required:
      - phone
    ApiResponseSmsResult:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/SmsResult"
        requestId:
          type: string
    SmsResult:
      type: object
      properties:
        expiresIn:
          type: integer
          format: int32
        retryAfter:
          type: integer
          format: int32
        debugCode:
          type: string
    ConsumerLogin:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "[0-9]{6}"
      required:
      - code
      - phone
    ApiResponseTokens:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/Tokens"
        requestId:
          type: string
    PrincipalView:
      type: object
      properties:
        accountId:
          type: string
        merchantId:
          type: string
        merchantCode:
          type: string
        role:
          type: string
          enum:
          - MERCHANT_STAFF
          - CONSUMER
        displayName:
          type: string
        phoneMasked:
          type: string
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
        principal:
          $ref: "#/components/schemas/PrincipalView"
    StaffCreate:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        displayName:
          type: string
          maxLength: 64
          minLength: 0
        password:
          type: string
          minLength: 1
      required:
      - displayName
      - password
      - phone
      - username
    AccountView:
      type: object
      properties:
        accountId:
          type: string
        merchantCode:
          type: string
        username:
          type: string
        displayName:
          type: string
        phoneMasked:
          type: string
        role:
          type: string
          enum:
          - MERCHANT_STAFF
          - CONSUMER
        status:
          type: string
    ApiResponseAccountView:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AccountView"
        requestId:
          type: string
    StaffLogin:
      type: object
      properties:
        merchantCode:
          type: string
          minLength: 1
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - identifier
      - merchantCode
      - password
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
        refreshRequestId:
          type: string
          minLength: 1
      required:
      - refreshRequestId
      - refreshToken
    Logout:
      type: object
      properties:
        refreshToken:
          type: string
    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data: {}
        requestId:
          type: string
    ApiResponsePrincipalView:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PrincipalView"
        requestId:
          type: string
    AuthErrorEnvelope:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data: {}
        requestId:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      in: header
      scheme: bearer
      bearerFormat: JWT
