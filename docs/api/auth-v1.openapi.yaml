openapi: 3.1.0
info:
  title: Merchant Assistant API
  description: 认证实现快照：9 操作。Bearer access 或 refresh body；所有响应 no-store。生产首员工、真实短信及前端另行交付。
  version: v1
servers:
- url: /
tags:
- name: auth-v1
  description: "Stateless auth; responses use Cache-Control: no-store. Errors: 400/10001\
    \ or 11002, 401/10002 or 11001, 403/10003, 404/10004, 409/10009, 429/11003 with\
    \ Retry-After, 503/11501 or 11502. IDs are strings and times are UTC."
paths:
  /api/v1/stores/{storeSlug}/auth/sms-codes:
    post:
      tags:
      - auth-v1
      summary: 发送 LOGIN 验证码
      description: 仅 dev mock 且显式打开时返回 debugCode；300 秒有效。生产短信 disabled 返回 503/11502。
      operationId: sendLoginSms
      parameters:
      - name: storeSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Sms"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: 与 envelope.requestId 相同
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSmsResult"
        "429":
          description: 11003 限流
          headers:
            X-Request-Id:
              description: 与 envelope.requestId 相同
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              description: 剩余窗口秒数
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorEnvelope"
        "409":
          description: 10009 员工标识冲突
          headers:
            X-Request-Id:
              description: 与 envelope.requestId 相同
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorEnvelope"
        "400":
          description: 10001 参数无效；11002 验证码无效
          headers:
            X-Request-Id:
              description: 与 envelope.requestId 相同
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorEnvelope"
        "401":
          description: 10002 会话无效；11001 凭证无效
          headers:
            X-Request-Id:
              description: 与 envelope.requestId 相同
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorEnvelope"
        "500":
          description: 10500 非预期错误
          headers:
            X-Request-Id:
              description: 与 envelope.requestId 相同
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
